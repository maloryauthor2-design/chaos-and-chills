<style>
:root{--ink:#07080c;--paper:#ece7da;--paper-dim:#9aa0aa;--acid:#a8f24a;--blood:#ff3b2f}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;background:var(--ink);color:var(--paper);font-family:Inter,system-ui,sans-serif;font-size:17px;line-height:1.6;padding:28px;text-align:center;-webkit-font-smoothing:antialiased}
main{max-width:52ch}
.kicker{font-weight:700;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--blood);margin-bottom:16px}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(34px,7vw,64px);line-height:1;letter-spacing:-.02em;color:#fff;font-variation-settings:'SOFT' 20,'WONK' 1;margin-bottom:18px}
h1 em{font-style:italic;color:var(--acid)}
p{color:var(--paper-dim);margin-bottom:26px}
.btn{display:inline-block;background:var(--acid);color:var(--ink);font-weight:800;padding:14px 22px;border-radius:3px;text-decoration:none;margin:0 6px 10px}
.btn.ghost{background:transparent;color:var(--paper);border:1px solid rgba(236,231,218,.3)}
a:focus-visible{outline:2px solid var(--acid);outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="kicker">Torch battery: dead</p>
